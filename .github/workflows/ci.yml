name: CI

on:
  # Every branch, not just main — a feature branch that only gets verified at
  # merge time is verified too late, and long-lived branches like v2 would
  # otherwise run unchecked for their whole life.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
